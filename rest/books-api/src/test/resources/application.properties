# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:bookshop_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate settings optimized for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable SQL script initialization if you only want to test via JPA
# Or keep it 'always' if you want your data.sql to load into H2 as well
spring.sql.init.mode=never