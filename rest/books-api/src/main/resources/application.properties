spring.application.name=books-api
server.port=8080

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/bookshop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration (Generates tables automatically based on your entities)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable SQL script initialization
spring.sql.init.mode=always

# Wait for Hibernate to create tables before running data.sql
spring.jpa.defer-datasource-initialization=true

# Hikari connection pool (to check)

# generate scripts out of my hibernate classes
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=drop-and-create.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-source=metadata
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.drop-target=drop-and-create.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=drop-and-create.sql
